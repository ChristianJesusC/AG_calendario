server {
    listen 5173;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA — redirige cualquier ruta al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend FastAPI
    location /ag/ {
        proxy_pass http://backend:8000/ag/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Necesario para Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /liga/ {
        proxy_pass http://backend:8000/liga/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
